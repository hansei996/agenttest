[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttest"
version = "0.3.0"
description = "把 agent 的行为当代码来测：record / replay / diff"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
agenttest = "agenttest.cli:main"

[project.urls]
Homepage = "https://github.com/hansei996/agenttest"
Issues = "https://github.com/hansei996/agenttest/issues"
Changelog = "https://github.com/hansei996/agenttest/blob/main/docs/CHANGELOG.md"
Documentation = "https://github.com/hansei996/agenttest/tree/main/docs"

[project.entry-points.pytest11]
agenttest = "agenttest.pytest_plugin"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
