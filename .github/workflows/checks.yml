name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install dev dependency
        run: python -m pip install --upgrade pip pytest
      - name: pytest
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q
      - name: cli acceptance
        env:
          PYTHONPATH: src
        run: |
          set -eux
          python -m agenttest replay examples/good --assert before:quote_error
          if python -m agenttest replay examples/bad --assert before:quote_error; then
            echo "examples/bad 竟然通过了断言，说明断言实现有问题" >&2
            exit 1
          fi
          python -m agenttest diff examples/good examples/bad
