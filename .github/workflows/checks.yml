name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # 每个 commit 一个组：连推时不会有任何一个 run 被取消（实测 cancel-in-progress 表达式没达到预期）
  group: checks-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tests:
    name: pytest (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install dev dependency
        run: python -m pip install --upgrade pip pytest
      - name: install package (editable)
        run: python -m pip install -e .
      - name: pytest
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q
      - name: demo self-proof
        env:
          PYTHONPATH: src
        run: python -m agenttest demo
      - name: dogfood (flaky report -> regress noise column)
        env:
          PYTHONPATH: src
        run: python tools/dogfood.py
      - name: performance smoke (2k events, thresholds)
        env:
          PYTHONPATH: src
        run: python tools/bench.py --quick
      - name: docs must not promise commands that do not exist
        env:
          PYTHONPATH: src
        run: python tools/doc_lint.py
      - name: cli acceptance
        env:
          PYTHONPATH: src
        run: |
          set -eux
          python -m agenttest replay examples/good --assert before:quote_error
          if python -m agenttest replay examples/bad --assert before:quote_error; then
            echo "examples/bad 竟然通过了断言，说明断言实现有问题" >&2
            exit 1
          fi
          python -m agenttest diff examples/good examples/bad
      - name: console script acceptance (no PYTHONPATH)
        run: |
          set -eux
          unset PYTHONPATH
          agenttest --help
          agenttest replay examples/good --assert before:quote_error
          agenttest record --repeat 5 /tmp/batch -- python examples/fake_agent.py --script good
          agenttest stat /tmp/batch/batch.jsonl --assert "success>=0.5" --assert "tokens<=20000"

  windows:
    name: pytest + console script (windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # 让 job 测我们的代码，而不是 runner 的 git 配置（CRLF 会改变产物哈希）
      - name: pin line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install dev dependency
        shell: pwsh
        run: python -m pip install --upgrade pip pytest
      - name: install package (editable)
        shell: pwsh
        run: python -m pip install -e .
      - name: pytest
        shell: pwsh
        env:
          PYTHONPATH: src
        # 故意不设 PYTHONIOENCODING：验证工具在 cp936 环境下也能正确输出
        run: python -m pytest tests -q
      - name: demo self-proof
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m agenttest demo
      - name: console script must work without PYTHONPATH
        shell: pwsh
        run: |
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $exe = Join-Path $scripts 'agenttest.exe'
          if (-not (Test-Path $exe)) { throw "pip install -e . 没生成 $exe" }
          $found = (Get-Command agenttest -ErrorAction SilentlyContinue).Source
          if (-not $found) { throw "装了但不在 PATH 上：$scripts（用户会踩，不能静音）" }
          "launcher = $found"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Push-Location $env:RUNNER_TEMP
          agenttest --help
          agenttest replay $env:GITHUB_WORKSPACE/examples/good --assert before:quote_error
          Pop-Location
      - name: no CRLF leaks into a hashed artifact
        shell: pwsh
        run: |
          python -c "import pathlib,sys; t=pathlib.Path('examples/.work/good/src/auth.py').read_bytes(); sys.exit('CRLF leaked into a hashed artifact' if b'\r\n' in t else 0)"
      - name: dogfood (flaky report -> regress noise column)
        env:
          PYTHONPATH: src
        run: python tools/dogfood.py
      - name: performance smoke (2k events, thresholds)
        env:
          PYTHONPATH: src
        run: python tools/bench.py --quick
      - name: docs must not promise commands that do not exist
        env:
          PYTHONPATH: src
        run: python tools/doc_lint.py