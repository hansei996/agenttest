name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install dev dependency
        run: python -m pip install --upgrade pip pytest
      - name: install package (editable)
        run: python -m pip install -e .
      - name: pytest
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q
      - name: cli acceptance
        env:
          PYTHONPATH: src
        run: |
          set -eux
          python -m agenttest replay examples/good --assert before:quote_error
          if python -m agenttest replay examples/bad --assert before:quote_error; then
            echo "examples/bad 竟然通过了断言，说明断言实现有问题" >&2
            exit 1
          fi
          python -m agenttest diff examples/good examples/bad
      - name: console script acceptance (no PYTHONPATH)
        run: |
          set -eux
          unset PYTHONPATH
          agenttest --help
          agenttest replay examples/good --assert before:quote_error
          agenttest record --repeat 5 /tmp/batch -- python examples/fake_agent.py --script good
          # n=5 全成功时 95% 置信区间下界只有 0.57，所以 0.5 能过、0.8 不能
          agenttest stat /tmp/batch/batch.jsonl --assert "success>=0.5" --assert "tokens<=20000"
          if agenttest stat /tmp/batch --assert "tokens<=10"; then
            echo "统计断言没有生效" >&2
            exit 1
          fi
          if agenttest stat /tmp/batch --assert "success>=0.99"; then
            echo "n=5 的置信区间下界 0.57 证不出 0.99，默认必须 FAIL" >&2
            exit 1
          fi
          agenttest stat /tmp/batch --assert "success>=0.99" --point-estimate
